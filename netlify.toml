# bubu-studio.com auf Netlify — statische Site, kein Build.
# Ersetzt das bisherige Hosting bei Hostinger (Apache).

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# www kanonisch auf die Apex-Domain
[[redirects]]
  from = "https://www.bubu-studio.com/*"
  to = "https://bubu-studio.com/:splat"
  status = 301
  force = true

# Die Workshop-Seite wurde nicht migriert, sie lebt jetzt auf www.bubu-tufting.com.
# 301 statt 404, damit Google den alten Eintrag aus dem Index nimmt und die Signale weitergibt.
[[redirects]]
  from = "/tufting"
  to = "https://www.bubu-tufting.com/"
  status = 301
  force = true

[[redirects]]
  from = "/tufting.html"
  to = "https://www.bubu-tufting.com/"
  status = 301
  force = true

[[redirects]]
  from = "/tufting/*"
  to = "https://www.bubu-tufting.com/"
  status = 301
  force = true

# Das Journal (Übersicht und alle Artikel) lebt jetzt auf bubu-tufting.com.
# /journal/* deckt auch /journal selbst und /journal/ ab.
[[redirects]]
  from = "/journal/*"
  to = "https://www.bubu-tufting.com/journal/"
  status = 301
  force = true

[[redirects]]
  from = "/journal.html"
  to = "https://www.bubu-tufting.com/journal/"
  status = 301
  force = true

[[redirects]]
  from = "/journal-*"
  to = "https://www.bubu-tufting.com/journal/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
